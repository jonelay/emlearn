# Native Sim configuration
# Runs natively on host with host FPU for floating-point operations
CONFIG_EMLEARN_BENCHMARK_STRUCTURED_OUTPUT=y

# Use POSIX clock_gettime for high-resolution timing
CONFIG_EMLEARN_TIMING_POSIX=y

# Native console - use POSIX_ARCH_CONSOLE (not UART) for native_sim
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_POSIX_ARCH_CONSOLE=y
