# Renode nRF52832/nRF52840 emulator configuration
#
# Uses DWT cycle counter for accurate timing. Requires:
# 1. Custom platform file with DWT: boards/nrf52840_dwt.repl
# 2. Small quantum for cycle-level timing:
#    emulation SetGlobalQuantum "00:00:00.000000016"  # 16ns = 1 cycle at 64MHz
#
# Build: west build --board nrf52840dk/nrf52840 -d build platform_examples/zephyr/benchmark
# Run:   See boards/renode_nrf52840.resc

CONFIG_EMLEARN_TIMING_DWT=y
CONFIG_EMLEARN_BENCHMARK_STRUCTURED_OUTPUT=y

# UART output for Renode (not RTT which requires J-Link)
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_UART_CONSOLE=y

# Required for UART to work in Renode with nRF52840 UARTE
CONFIG_UART_NRFX_UARTE_NO_IRQ=y

# Use standard tick rate - 1MHz causes crashes in Renode
# nRF52840 uses RTC for system clock at 32768 Hz
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768

# Stack size for benchmark
CONFIG_MAIN_STACK_SIZE=8192
