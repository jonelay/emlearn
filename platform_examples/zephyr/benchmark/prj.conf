# System tick rate - use 1kHz for millisecond resolution
# Note: nRF52 RTC runs at 32768 Hz, so 1MHz is not possible
# DWT cycle counter provides higher resolution for actual timing measurements
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Enable console output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Disable features we don't need to reduce size
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=y

# emlearn benchmark configuration (defaults)
CONFIG_EMLEARN_BENCHMARK=y
CONFIG_EMLEARN_BENCHMARK_ITERATIONS=100
CONFIG_EMLEARN_BENCHMARK_WARMUP=10
CONFIG_EMLEARN_BENCHMARK_STRUCTURED_OUTPUT=y
